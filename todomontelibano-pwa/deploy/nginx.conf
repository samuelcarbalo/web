# Hostinger / Nginx — SPA + HTML prerenderizado + caché / gzip
# Copiar los bloques a la config del vhost (o incluir este archivo).

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

# Brotli (si el módulo está cargado)
# brotli on;
# brotli_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

# Caché agresiva para JS/CSS compilados con hash
location ~* \.(?:css|js)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* \.(?:woff2)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Service worker y manifest nunca immutable
location ~* (?:sw\.js|workbox-.+\.js|notification-sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
}

# Respuesta rápida para HTML prerenderizado
location / {
    try_files $uri $uri/index.html $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
