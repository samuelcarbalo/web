<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chever-logo.svg" />
    <link rel="apple-touch-icon" href="/chever-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#021433" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- SEO base (crítico para crawlers que no ejecutan JS: WhatsApp, Facebook, Slack) -->
    <title>Chever | Empleos, Deportes, Bienes Raíces y Eventos</title>
    <meta
      name="description"
      content="Plataforma integral Chever: bolsa de empleo, torneos deportivos, propiedades inmobiliarias y eventos publicitarios en Córdoba, Colombia."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://chever.co/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Chever" />
    <meta property="og:title" content="Chever | Empleos, Deportes, Bienes Raíces y Eventos" />
    <meta
      property="og:description"
      content="Plataforma integral Chever: bolsa de empleo, torneos deportivos, propiedades inmobiliarias y eventos publicitarios en Córdoba, Colombia."
    />
    <meta property="og:url" content="https://chever.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:image" content="https://chever.co/chever-logo.svg" />
    <meta property="og:image:secure_url" content="https://chever.co/chever-logo.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chever — Empleos, deportes, bienes raíces y eventos en Córdoba" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chever | Empleos, Deportes, Bienes Raíces y Eventos" />
    <meta
      name="twitter:description"
      content="Plataforma integral Chever: bolsa de empleo, torneos deportivos, propiedades inmobiliarias y eventos publicitarios en Córdoba, Colombia."
    />
    <meta name="twitter:image" content="https://chever.co/chever-logo.svg" />
    <meta name="twitter:image:alt" content="Chever — Empleos, deportes, bienes raíces y eventos en Córdoba" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chever" />
  </head>
  <body>
    <noscript>
      <div style="padding:1.5rem;font-family:system-ui,sans-serif;max-width:48rem;margin:0 auto">
        <h1>Chever</h1>
        <p>Plataforma de empleos, deportes, bienes raíces y eventos en Córdoba, Colombia.</p>
        <p>Activa JavaScript para usar la aplicación completa, o visita nuestras secciones principales:</p>
        <ul>
          <li><a href="/empleos">Empleos</a></li>
          <li><a href="/deportes">Deportes</a></li>
          <li><a href="/bienes-raices">Bienes Raíces</a></li>
          <li><a href="/eventos">Eventos</a></li>
        </ul>
      </div>
    </noscript>
    <div id="root">
      <div
        id="app-boot"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f8fafc;color:#334155;gap:1rem;padding:1.5rem;text-align:center"
      >
        <div
          style="width:2.5rem;height:2.5rem;border:3px solid #ddd6fe;border-top-color:#7c3aed;border-radius:9999px;animation:boot-spin .8s linear infinite"
        ></div>
        <p style="margin:0;font-weight:600">Cargando Chever…</p>
      </div>
    </div>
    <style>
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      html.dark #app-boot {
        background: #030712;
        color: #cbd5e1;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Si React no monta en 8s, forzar una recarga con cache-bust (una sola vez) -->
    <script>
      (function () {
        var KEY = 'boot_watchdog_v1';
        setTimeout(function () {
          if (!document.getElementById('app-boot')) return;
          try {
            if (sessionStorage.getItem(KEY) === '1') return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          var u = new URL(location.href);
          u.searchParams.set('_boot', String(Date.now()));
          location.replace(u.toString());
        }, 8000);
      })();
    </script>
  </body>
</html>
