    <!-- manifest se inyecta tras load (no compite con el JS crítico) -->
    <script>
      (function () {
        // Solo marca versión + limpia Cache Storage. Sin location.reload() (evita bucles con el SW).
        var APP_VERSION = '1.0.3';
        var KEY = 'chever_app_version';
        try {
          var prev = localStorage.getItem(KEY);
          if (prev !== APP_VERSION) {
            localStorage.setItem(KEY, APP_VERSION);
            if (prev && 'caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {});
            }
          }
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <!-- Manifest PWA diferido: no forma parte de la cadena crítica de LCP -->
    <script>
      (function () {
        function injectManifest() {
          if (document.querySelector('link[rel="manifest"]')) return;
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/manifest.webmanifest';
          document.head.appendChild(link);
        }
        if (document.readyState === 'complete') {
          setTimeout(injectManifest, 0);
        } else {
          window.addEventListener('load', function () {
            setTimeout(injectManifest, 0);
          });
        }
      })();
    </script>
    <!-- Si React no monta en 8s, forzar una recarga con cache-bust (una sola vez) -->
    <script>
      (function () {
        var KEY = 'boot_watchdog_v1';
        setTimeout(function () {
          if (!document.getElementById('app-boot')) return;
          try {
            if (sessionStorage.getItem(KEY) === '1') return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          var u = new URL(location.href);
          u.searchParams.set('_boot', String(Date.now()));
          location.replace(u.toString());
        }, 8000);
      })();
    </script>
